name: Implantar Gestao Cultural FUNDART
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fundart-gestao-deploy.yml"
      - "wordpress/plugins/fundart-gestao/**"
permissions:
  contents: read
concurrency:
  group: fundart-gestao
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 77.37.40.81
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: "120s"
          command_timeout: "8m"
          script: |
            set -Eeuo pipefail
            umask 077
            cd /opt/fundart
            test "$(docker inspect -f '{{.State.Running}}' fundart-wp-staging-app)" = true
            test "$(docker inspect -f '{{.State.Running}}' fundart-wp-staging-db)" = true
            set -a
            . /opt/fundart-secrets/wordpress-staging.env
            set +a
            install -d -m 700 /opt/fundart-secrets/backups
            DUMP="/opt/fundart-secrets/backups/fundart-before-gestao-$(date +%Y%m%d-%H%M%S).sql"
            docker exec -e MYSQL_PWD="$FUNDART_STAGING_ROOT_PASSWORD" fundart-wp-staging-db mariadb-dump -uroot --single-transaction fundart_wp > "$DUMP"
            test -s "$DUMP"
            chmod 600 "$DUMP"
            echo "DB_BACKUP=YES"
            git fetch -q origin main
            install -d -m 755 wordpress/plugins/fundart-gestao
            git show origin/main:wordpress/plugins/fundart-gestao/fundart-gestao.php > wordpress/plugins/fundart-gestao/fundart-gestao.php
            chmod 644 wordpress/plugins/fundart-gestao/fundart-gestao.php
            docker exec fundart-wp-staging-app mkdir -p /var/www/html/wp-content/plugins/fundart-gestao
            docker cp wordpress/plugins/fundart-gestao/fundart-gestao.php fundart-wp-staging-app:/var/www/html/wp-content/plugins/fundart-gestao/fundart-gestao.php
            docker exec fundart-wp-staging-app chmod 644 /var/www/html/wp-content/plugins/fundart-gestao/fundart-gestao.php
            docker exec fundart-wp-staging-app php -l /var/www/html/wp-content/plugins/fundart-gestao/fundart-gestao.php
            docker run --rm --network fundart-wordpress-staging_fundart_staging_internal --user 33:33 \
              --mount type=volume,src=fundart-wordpress-staging_fundart_staging_wp,dst=/var/www/html \
              --mount type=bind,src=/opt/fundart/wordpress/themes/fundart,dst=/var/www/html/wp-content/themes/fundart,readonly \
              -e WORDPRESS_DB_HOST=database:3306 \
              -e WORDPRESS_DB_NAME=fundart_wp \
              -e WORDPRESS_DB_USER=fundart_wp \
              -e WORDPRESS_DB_PASSWORD="$FUNDART_STAGING_DB_PASSWORD" \
              -e WORDPRESS_TABLE_PREFIX=fdt_ \
              -e WORDPRESS_CONFIG_EXTRA="define('WP_HOME','https://fundart.mskpoeira.com.br');define('WP_SITEURL','https://fundart.mskpoeira.com.br');" \
              wordpress:cli-php8.3 wp --path=/var/www/html plugin activate fundart-gestao
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 12 https://fundart.mskpoeira.com.br/wp-admin/admin.php?page=fundart-gestao)"
            echo "ADMIN_AUTH_GATE_HTTP=$code"
            test "$code" = 302 -o "$code" = 200
            echo "FUNDART_GESTAO_DEPLOY=OK"
