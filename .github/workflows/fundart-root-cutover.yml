name: Migrar WordPress FUNDART para raiz
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fundart-root-cutover.yml"
permissions:
  contents: read
concurrency:
  group: fundart-root-cutover
  cancel-in-progress: false
jobs:
  cutover:
    runs-on: ubuntu-24.04
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 77.37.40.81
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: "120s"
          command_timeout: "12m"
          script: |
            set -Eeuo pipefail
            umask 077
            cd /opt/fundart
            test "$(docker inspect -f '{{.State.Running}}' fundart-wp-staging-app)" = true
            test "$(docker inspect -f '{{.State.Running}}' fundart-wp-staging-db)" = true
            test "$(docker inspect -f '{{.State.Running}}' fundart-web-prod)" = true
            test -f /opt/fundart-secrets/wordpress-staging.env
            CADDY_SITE=/etc/caddy/sites/fundart.caddy
            test -f "$CADDY_SITE"
            mkdir -p /opt/fundart-secrets/backups
            stamp="$(date +%Y%m%d-%H%M%S)"
            cp -p "$CADDY_SITE" "/opt/fundart-secrets/backups/caddy-before-root-$stamp"
            echo "CADDY_BACKUP=OK"
            # Preserve actual WordPress database in authenticated SQL backup.
            set -a
            . /opt/fundart-secrets/wordpress-staging.env
            set +a
            DB_DUMP="/opt/fundart-secrets/backups/staging-wordpress-before-root-$stamp.sql"
            docker exec -e MYSQL_PWD="$FUNDART_STAGING_ROOT_PASSWORD" fundart-wp-staging-db mariadb-dump -uroot --single-transaction --quick fundart_wp > "$DB_DUMP"
            test -s "$DB_DUMP"
            chmod 600 "$DB_DUMP"
            echo "DB_BACKUP=OK"
            # Update runtime home/siteurl without touching the database; config has precedence.
            git fetch -q origin main
            TEMP="$(mktemp /opt/fundart/.root-compose-XXXXXX.yml)"
            trap 'rm -f "$TEMP"' EXIT
            git show origin/main:docker-compose.wordpress.staging.yml | sed "s#https://fundart.mskpoeira.com.br/homologacao#https://fundart.mskpoeira.com.br#g" > "$TEMP"
            docker compose --project-directory /opt/fundart --env-file /opt/fundart-secrets/wordpress-staging.env -f "$TEMP" config -q
            docker compose --project-directory /opt/fundart --env-file /opt/fundart-secrets/wordpress-staging.env -f "$TEMP" up -d --no-deps --force-recreate wordpress
            for i in $(seq 1 35); do
              CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 6 http://127.0.0.1:63252/wp-login.php || true)"
              if [ "$CODE" = 200 ] || [ "$CODE" = 302 ]; then break; fi
              sleep 3
            done
            test "$CODE" = 200 -o "$CODE" = 302
            echo "WORDPRESS_INTERNAL=OK"
            cp -p "$CADDY_SITE" "/opt/fundart-secrets/backups/caddy-rollback-$stamp"
            python3 - <<'PY'
            from pathlib import Path
            p=Path('/etc/caddy/sites/fundart.caddy')
            s=p.read_text()
            start=s.index('    # Entradas administrativas amigáveis')
            s=s[:start]+'''    # WordPress na raiz do dominio de testes.
                @oldHomologacao path /homologacao /homologacao/*
                redir @oldHomologacao / 302
                reverse_proxy 127.0.0.1:63252 {
                    header_up X-Forwarded-Proto https
                }
            }
            '''
            p.write_text(s)
            PY
            if ! caddy validate --config /etc/caddy/Caddyfile; then
              cp "/opt/fundart-secrets/backups/caddy-rollback-$stamp" "$CADDY_SITE"
              caddy validate --config /etc/caddy/Caddyfile
              exit 1
            fi
            systemctl reload caddy
            ROOT_CODE="$(curl -s -L -o /dev/null -w '%{http_code}' --max-time 18 https://fundart.mskpoeira.com.br/ || true)"
            LOGIN_CODE="$(curl -s -L -o /dev/null -w '%{http_code}' --max-time 18 https://fundart.mskpoeira.com.br/wp-login.php || true)"
            CSS_CODE="$(curl -s -L -o /dev/null -w '%{http_code}' --max-time 18 https://fundart.mskpoeira.com.br/wp-content/themes/fundart/style.css || true)"
            echo "ROOT=$ROOT_CODE LOGIN=$LOGIN_CODE CSS=$CSS_CODE"
            if [ "$ROOT_CODE" != 200 ] || [ "$LOGIN_CODE" != 200 ] || [ "$CSS_CODE" != 200 ]; then
              cp "/opt/fundart-secrets/backups/caddy-rollback-$stamp" "$CADDY_SITE"
              caddy validate --config /etc/caddy/Caddyfile
              systemctl reload caddy
              echo "ROOT_CUTOVER_ROLLED_BACK=YES"
              exit 1
            fi
            echo "ROOT_CUTOVER=OK"
