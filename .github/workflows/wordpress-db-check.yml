name: Verificar administração MariaDB FUNDART
on:
  push:
    branches: [main]
    paths: [".github/workflows/wordpress-db-check.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 77.37.40.81
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: "120s"
          command_timeout: "3m"
          script: |
            set -eu
                        echo "=== SECURE ENV FILES ==="
            for p in /opt/fundart-secrets/wordpress.env /opt/fundart/.env.wp /opt/fundart/.env; do
              if test -f "$p"; then echo "ENV_FOUND=$p"; else echo "ENV_ABSENT=$p"; fi
            done
            echo "=== DB BACKUP FILES ==="
            find /opt/fundart-secrets /opt/fundart -maxdepth 2 -type f -name '*.sql*' -printf 'BACKUP=%p\n' 2>/dev/null | head -15 || true
            echo "Checking DB admin access through local socket" 
            if docker exec -u root fundart-wp-db mariadb --protocol=socket -uroot -N -e "SELECT 1" >/dev/null 2>&1; then echo DB_SOCKET_ROOT=OK; else echo DB_SOCKET_ROOT=DENIED; fi
            echo "Checking DB admin access"
            docker exec fundart-wp-db sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb -uroot -N -e "SELECT 1" >/dev/null' && echo DB_ROOT_AUTH=OK
            echo "Checking database"
            docker exec fundart-wp-db sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb -uroot -N -e "SELECT COUNT(*) FROM information_schema.schemata WHERE schema_name = '\''fundart_wp'\''"' | awk '{print "DB_EXISTS=" $1}'
            echo "Checking application user"
            docker exec fundart-wp-db sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb -uroot -N -e "SELECT COUNT(*) FROM mysql.user WHERE User = '\''fundart_wp'\''"' | awk '{print "DB_APP_USERS=" $1}'
