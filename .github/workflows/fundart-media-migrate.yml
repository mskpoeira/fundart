name: FUNDART - Recuperar Biblioteca de Midia
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fundart-media-migrate.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
concurrency:
  group: fundart-media-library-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validar importador
        run: php -l wordpress/import-media-batch.php
      - name: Importar com backup e lotes limitados apenas no WordPress de testes
        uses: appleboy/ssh-action@v1
        with:
          host: 77.37.40.81
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: "120s"
          command_timeout: "20m"
          script: |
            set -Eeuo pipefail
            umask 077
            cd /opt/fundart
            test "$(docker inspect -f '{{.State.Running}}' fundart-wp-staging-app)" = true
            test "$(docker inspect -f '{{.State.Running}}' fundart-wp-staging-db)" = true
            test -s /opt/fundart-secrets/migration/sitemap-inventory.json
            chmod 644 /opt/fundart-secrets/migration/sitemap-inventory.json
            set -a
            . /opt/fundart-secrets/wordpress-staging.env
            set +a
            install -d -m 700 /opt/fundart-secrets/backups
            dump="/opt/fundart-secrets/backups/media-db-$(date +%Y%m%d-%H%M%S).sql"
            docker exec -e MYSQL_PWD="$FUNDART_STAGING_ROOT_PASSWORD" fundart-wp-staging-db mariadb-dump -uroot --single-transaction fundart_wp > "$dump"
            test -s "$dump"
            chmod 600 "$dump"
            echo MEDIA_DB_BACKUP=OK
            git fetch -q origin main
            git show origin/main:wordpress/import-media-batch.php > wordpress/import-media-batch.php
            chmod 644 wordpress/import-media-batch.php
            for phase in references inventory; do
              if [ "$phase" = references ]; then limit=25; else limit=15; fi
              docker run --rm --network fundart-wordpress-staging_fundart_staging_internal --user 33:33 \
                --mount type=volume,src=fundart-wordpress-staging_fundart_staging_wp,dst=/var/www/html \
                --mount type=bind,src=/opt/fundart/wordpress/themes/fundart,dst=/var/www/html/wp-content/themes/fundart,readonly \
                --mount type=bind,src=/opt/fundart/wordpress/import-media-batch.php,dst=/media-import.php,readonly \
                --mount type=bind,src=/opt/fundart-secrets/migration/sitemap-inventory.json,dst=/manifest.json,readonly \
                -e FUNDART_MEDIA_PHASE="$phase" -e FUNDART_MEDIA_LIMIT="$limit" \
                -e WORDPRESS_DB_HOST=database:3306 -e WORDPRESS_DB_NAME=fundart_wp \
                -e WORDPRESS_DB_USER=fundart_wp -e WORDPRESS_DB_PASSWORD="$FUNDART_STAGING_DB_PASSWORD" \
                -e WORDPRESS_TABLE_PREFIX=fdt_ \
                -e WORDPRESS_CONFIG_EXTRA="define('WP_HOME','https://fundart.mskpoeira.com.br');define('WP_SITEURL','https://fundart.mskpoeira.com.br');" \
                wordpress:cli-php8.3 wp --path=/var/www/html eval-file /media-import.php
            done
            echo FUNDART_MEDIA_CYCLE=OK
