name: Inicializar painel WordPress FUNDART
on:
  push:
    branches: [main]
    paths: [".github/workflows/wordpress-staging-init.yml"]
permissions:
  contents: read
concurrency:
  group: fundart-wordpress-staging
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 77.37.40.81
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: "120s"
          command_timeout: "18m"
          script: |
            set -Eeuo pipefail
            umask 077
            cd /opt/fundart
            git fetch -q origin main
            git show origin/main:docker-compose.wordpress.staging.yml > docker-compose.wordpress.staging.yml
            git show origin/main:wordpress/bootstrap.php > wordpress/bootstrap.php
            find wordpress/themes/fundart -type d -exec chmod 755 {} +
            find wordpress/themes/fundart -type f -exec chmod 644 {} +
            chmod 644 wordpress/bootstrap.php
            ENV_FILE=/opt/fundart-secrets/wordpress-staging.env
            test -f "$ENV_FILE"
            set -a
            . "$ENV_FILE"
            set +a
            docker compose --env-file "$ENV_FILE" -f docker-compose.wordpress.staging.yml config -q
            # Recreate staging application only; both database volumes stay untouched.
            docker compose --env-file "$ENV_FILE" -f docker-compose.wordpress.staging.yml up -d --no-deps --force-recreate wordpress
            for i in $(seq 1 25); do
              if curl -s -o /dev/null --max-time 5 http://127.0.0.1:63252/wp-login.php; then break; fi
              sleep 2
            done
            ADMIN_FILE=/opt/fundart-secrets/wordpress-staging-admin.env
            if [ ! -f "$ADMIN_FILE" ]; then
              { printf "WP_ADMIN_USER=fundart_admin\n"; printf "WP_ADMIN_PASSWORD=%s\n" "$(openssl rand -hex 24)"; } > "$ADMIN_FILE"
              chmod 600 "$ADMIN_FILE"
            fi
            set -a
            . "$ADMIN_FILE"
            set +a
            WP_VOL=fundart-wordpress-staging_fundart_staging_wp
            WP_NET=fundart-wordpress-staging_fundart_staging_internal
            wpcli() {
              docker run --rm --network "$WP_NET" --user 33:33 \
                --mount type=volume,src="$WP_VOL",dst=/var/www/html \
                --mount type=bind,src=/opt/fundart/wordpress/themes/fundart,dst=/var/www/html/wp-content/themes/fundart,readonly \
                --mount type=bind,src=/opt/fundart/wordpress/bootstrap.php,dst=/bootstrap.php,readonly \
                -e WORDPRESS_DB_HOST=database:3306 \
                -e WORDPRESS_DB_NAME=fundart_wp \
                -e WORDPRESS_DB_USER=fundart_wp \
                -e WORDPRESS_DB_PASSWORD="$FUNDART_STAGING_DB_PASSWORD" \
                -e WORDPRESS_TABLE_PREFIX=fdt_ \
                -e WORDPRESS_CONFIG_EXTRA="define('WP_HOME','https://fundart.mskpoeira.com.br/homologacao');define('WP_SITEURL','https://fundart.mskpoeira.com.br/homologacao');" \
                wordpress:cli-php8.3 wp --path=/var/www/html "$@"
            }
            if wpcli core is-installed >/dev/null 2>&1; then echo "WORDPRESS_ALREADY_INSTALLED=YES"; else
              wpcli core install --url="https://fundart.mskpoeira.com.br/homologacao" --title="FUNDART — Fundação de Arte e Cultura de Ubatuba" --admin_user="$WP_ADMIN_USER" --admin_password="$WP_ADMIN_PASSWORD" --admin_email="fundart@fundart.com.br" --skip-email
              echo "WORDPRESS_INSTALLED=YES"
            fi
            wpcli theme activate fundart
            wpcli eval-file /bootstrap.php
            wpcli rewrite flush --hard || true
            echo "THEME_AND_PAGES_CONFIGURED=YES"
            docker inspect fundart-web-prod --format 'STATIC_RUNNING={{.State.Running}}'
            docker inspect fundart-wp-db --format 'ORIGINAL_DB_RUNNING={{.State.Running}}'
