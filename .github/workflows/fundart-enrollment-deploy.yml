name: Instalar formularios FUNDART em homologacao
on:
  push:
    branches: [main]
    paths: [".github/workflows/fundart-enrollment-deploy.yml"]
permissions:
  contents: read
concurrency:
  group: fundart-enrollment-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 77.37.40.81
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: "120s"
          command_timeout: "10m"
          script: |
            set -Eeuo pipefail
            umask 077
            cd /opt/fundart
            test "$(docker inspect -f '{{.State.Running}}' fundart-wp-staging-app)" = true
            test "$(docker inspect -f '{{.State.Running}}' fundart-wp-staging-db)" = true
            install -d -m 700 /opt/fundart-secrets/backups
            set -a
            . /opt/fundart-secrets/wordpress-staging.env
            set +a
            DUMP="/opt/fundart-secrets/backups/before-forms-$(date +%Y%m%d-%H%M%S).sql"
            docker exec -e MYSQL_PWD="$FUNDART_STAGING_ROOT_PASSWORD" fundart-wp-staging-db mariadb-dump -uroot --single-transaction fundart_wp > "$DUMP"
            test -s "$DUMP"
            chmod 600 "$DUMP"
            echo "DB_BACKUP=OK"
            git fetch -q origin main
            install -d -m 755 wordpress/plugins/fundart-inscricoes
            git show origin/main:wordpress/plugins/fundart-inscricoes/fundart-inscricoes.php > wordpress/plugins/fundart-inscricoes/fundart-inscricoes.php
            git show origin/main:wordpress/setup-enrollment-pages.php > wordpress/setup-enrollment-pages.php
            chmod 644 wordpress/plugins/fundart-inscricoes/fundart-inscricoes.php wordpress/setup-enrollment-pages.php
            docker exec fundart-wp-staging-app mkdir -p /var/www/html/wp-content/plugins/fundart-inscricoes
            docker cp wordpress/plugins/fundart-inscricoes/fundart-inscricoes.php fundart-wp-staging-app:/var/www/html/wp-content/plugins/fundart-inscricoes/fundart-inscricoes.php
            docker exec fundart-wp-staging-app chmod 644 /var/www/html/wp-content/plugins/fundart-inscricoes/fundart-inscricoes.php
            docker exec fundart-wp-staging-app php -l /var/www/html/wp-content/plugins/fundart-inscricoes/fundart-inscricoes.php
            wpcli() {
              docker run --rm --network fundart-wordpress-staging_fundart_staging_internal --user 33:33 \
                --mount type=volume,src=fundart-wordpress-staging_fundart_staging_wp,dst=/var/www/html \
                --mount type=bind,src=/opt/fundart/wordpress/themes/fundart,dst=/var/www/html/wp-content/themes/fundart,readonly \
                --mount type=bind,src=/opt/fundart/wordpress/setup-enrollment-pages.php,dst=/setup-forms.php,readonly \
                -e WORDPRESS_DB_HOST=database:3306 \
                -e WORDPRESS_DB_NAME=fundart_wp \
                -e WORDPRESS_DB_USER=fundart_wp \
                -e WORDPRESS_DB_PASSWORD="$FUNDART_STAGING_DB_PASSWORD" \
                -e WORDPRESS_TABLE_PREFIX=fdt_ \
                -e WORDPRESS_CONFIG_EXTRA="define('WP_HOME','https://fundart.mskpoeira.com.br');define('WP_SITEURL','https://fundart.mskpoeira.com.br');" \
                wordpress:cli-php8.3 wp --path=/var/www/html "$@"
            }
            wpcli plugin activate fundart-inscricoes
            wpcli eval-file /setup-forms.php
            for page in inscricoes-oficinas credenciamento-arte-educadores; do
              code="$(curl -s -L --max-time 12 -o /dev/null -w '%{http_code}' "https://fundart.mskpoeira.com.br/$page/")"
              echo "PAGE=$page HTTP=$code"
              test "$code" = 200
            done
            curl -fsSL --max-time 12 https://fundart.mskpoeira.com.br/inscricoes-oficinas/ | grep -q 'fundart_oficina_aluno'
            curl -fsSL --max-time 12 https://fundart.mskpoeira.com.br/credenciamento-arte-educadores/ | grep -q 'fundart_oficina_educador'
            echo "TWO_FORMS_DEPLOY=OK"
