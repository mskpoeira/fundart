<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fundart Ubatuba</title>
  <meta name="description" content="Fundação de Arte e Cultura de Ubatuba — ambiente de atualização do novo site.">
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f1e8;
      color: #3b2a20;
    }
    main {
      width: min(92%, 760px);
      padding: 48px 32px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(59, 42, 32, .12);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 4rem); }
    p { margin: 0; font-size: 1.1rem; line-height: 1.6; }
    small { display: block; margin-top: 24px; opacity: .65; }
  </style>
</head>
<body>
  <main>
    <h1>Fundart Ubatuba</h1>
    <p>Novo site em atualização. Este endereço já está preparado para receber automaticamente as publicações do GitHub.</p>
    <small>fundart.mskpoeira.com.br</small>
  </main>
</body>
</html>
